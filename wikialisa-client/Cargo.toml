description = "RPC Client and interaction library for Wikialisa Layer 1 nodes"

[dependencies]
wikialisa-sdk = { path = "../wikialisa-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
